name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t mcp-ssh-server:test .

      - name: Test Docker image
        run: |
          docker run --rm mcp-ssh-server:test node --version
          docker images mcp-ssh-server:test --format "{{.Size}}"

      - name: Scan for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL mcp-ssh-server:test

      - name: Test container structure
        run: |
          docker run --rm --entrypoint /bin/sh mcp-ssh-server:test -c "ls -la /app && node --version"
